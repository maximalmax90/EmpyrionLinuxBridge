<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{t "changePassword.pageTitle"}}</title>
  <link rel="icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <h1>{{if .MustChangePassword}}{{t "changePassword.heading"}}{{else}}{{t "changePassword.headingVoluntary"}}{{end}}</h1>
      <form method="post" action="/change-password">
        <label for="currentPassword">{{t "changePassword.currentPassword"}}</label>
        <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required autofocus>
        <label for="username">{{t "changePassword.newUsername"}}</label>
        <input type="text" id="username" name="username" value="{{.Username}}" autocomplete="username" required>
        <label for="password">{{t "changePassword.newPassword"}}</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
        <label for="password2">{{t "changePassword.confirmPassword"}}</label>
        <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="6">
        <button type="submit">{{t "changePassword.submit"}}</button>
        {{if not .MustChangePassword}}<a href="/" class="auth-cancel">{{t "changePassword.cancel"}}</a>{{end}}
      </form>
      {{if .Error}}<div class="auth-error">{{.Error}}</div>{{end}}
      {{if .MustChangePassword}}<div class="auth-hint">{{t "changePassword.hint"}}</div>{{end}}
    </div>
  </div>
</body>
</html>
